name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.7.13
      - name: Sync locked Python workspace
        run: uv sync --all-packages --group dev --frozen
      - name: Format, lint, and type check
        run: |
          uv run ruff format --check apps/api/src services/ml/src tests scripts
          uv run ruff check apps/api/src services/ml/src tests scripts
          uv run mypy
      - name: Unit and architecture tests
        run: uv run pytest -m "not integration"
      - name: Architecture, repository policy, and documentation checks
        run: |
          uv run python scripts/check_architecture.py
          uv run python scripts/check_repository_policy.py

  web-contract-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
      - name: Install pinned toolchains
        run: |
          python -m pip install --disable-pip-version-check uv==0.7.13
          corepack enable
          corepack pnpm install --frozen-lockfile
          uv sync --all-packages --group dev --frozen
      - name: Regenerate authoritative OpenAPI and types
        run: |
          uv run python scripts/generate_openapi.py
          corepack pnpm check:generated
      - name: Lint, type check, test, and build web workspace
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
      - name: Audit production web dependencies
        run: corepack pnpm audit --prod --audit-level high

  local-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify Compose syntax
        run: docker compose config --quiet
      - name: Install pinned uv and test dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.7.13
          uv sync --all-packages --group dev --frozen
      - name: Verify PostgreSQL and Redis health checks
        env:
          RUN_CONTAINER_TESTS: "1"
        run: uv run pytest -m integration
      - name: Validate image recipes
        run: docker compose --profile app build api web
