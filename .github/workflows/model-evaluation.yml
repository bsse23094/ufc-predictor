name: Model evaluation gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Confirm no unreviewed model evaluation is claimed
        run: grep -F "No model has been trained" MODEL_CARD.md
