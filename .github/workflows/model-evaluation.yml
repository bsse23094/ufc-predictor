name: Model evaluation gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Confirm no unreviewed model evaluation is claimed
        run: grep -F "No model has been trained" MODEL_CARD.md
