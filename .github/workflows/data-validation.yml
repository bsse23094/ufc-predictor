name: Data validation gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Confirm source audit remains explicit before M2 approval
        run: |
          grep -F "no source availability or field is asserted until verified" docs/architecture/DATA_SOURCE_AUDIT.md
          grep -F "No source has been approved or ingested" data/README.md
