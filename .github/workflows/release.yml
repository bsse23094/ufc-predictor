name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-release-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Block production release before launch milestone
        run: |
          echo "Production release is unavailable until the M14 launch gate is passed."
          exit 1
