[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ufc-predictor-ml"
version = "0.1.0"
description = "Reproducible data and ML package for UFC Predictor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.11.7",
  "polars==1.30.0",
  "typer==0.16.0",
]

[project.optional-dependencies]
# Install only in the owning milestone or an ML/training image. Keeping these
# exact extras out of the M1 default environment preserves a fast, deterministic
# foundation bootstrap without weakening the lockfile policy.
ingestion = [
  "httpx==0.28.1",
  "tenacity==9.1.2",
]
analytics = [
  "duckdb==1.3.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pandera==0.24.0",
  "scikit-learn==1.6.1",
]

[project.scripts]
ufc-predictor = "ufc_predictor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ufc_predictor"]
