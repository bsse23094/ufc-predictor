name: ufc-predictor

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ufc_predictor
      POSTGRES_USER: ufc_predictor
      POSTGRES_PASSWORD: ufc_predictor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufc_predictor -d ufc_predictor"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://ufc_predictor:ufc_predictor@postgres:5432/ufc_predictor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      UV_CACHE_DIR: /tmp/uv-cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "celery", "-A", "ufc_api.worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://ufc_predictor:ufc_predictor@postgres:5432/ufc_predictor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      UV_CACHE_DIR: /tmp/uv-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
